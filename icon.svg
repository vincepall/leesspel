<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <!-- Achtergrond met afgeronde hoeken -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="410" cy="105" r="52" fill="#60A5FA" opacity="0.35"/>
  <circle cx="95" cy="410" r="68" fill="#60A5FA" opacity="0.25"/>

  <!-- Open leesboek onderaan -->
  <path d="M86 355 Q170 330 256 365 Q342 330 426 355 L426 425 Q342 400 256 435 Q170 400 86 425 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8" stroke-linejoin="round"/>
  <path d="M256 365 L256 435" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  <path d="M76 420 Q170 395 256 432 Q342 395 436 420" fill="none" stroke="#22C55E" stroke-width="16" stroke-linecap="round"/>

  <!-- 3 Lijn-3 Klankblokjes: b - oo - t -->
  <!-- Blokje 1: b -->
  <g transform="translate(54, 150) rotate(-6, 65, 75)">
    <rect x="0" y="8" width="124" height="138" rx="26" fill="#CA8A04"/>
    <rect x="0" y="0" width="124" height="136" rx="26" fill="url(#sunGrad)" stroke="#FFFFFF" stroke-width="6"/>
    <text x="62" y="96" font-family="Verdana, sans-serif" font-size="82" font-weight="bold" fill="#713F12" text-anchor="middle">b</text>
  </g>

  <!-- Blokje 2: oo -->
  <g transform="translate(184, 128)">
    <rect x="0" y="8" width="144" height="142" rx="26" fill="#15803D"/>
    <rect x="0" y="0" width="144" height="140" rx="26" fill="#86EFAC" stroke="#FFFFFF" stroke-width="6"/>
    <text x="72" y="96" font-family="Verdana, sans-serif" font-size="76" font-weight="bold" fill="#14532D" text-anchor="middle">oo</text>
  </g>

  <!-- Blokje 3: t -->
  <g transform="translate(334, 150) rotate(6, 62, 75)">
    <rect x="0" y="8" width="124" height="138" rx="26" fill="#C2410C"/>
    <rect x="0" y="0" width="124" height="136" rx="26" fill="#FDBA74" stroke="#FFFFFF" stroke-width="6"/>
    <text x="62" y="96" font-family="Verdana, sans-serif" font-size="82" font-weight="bold" fill="#7C2D12" text-anchor="middle">t</text>
  </g>

  <!-- Gouden ster bovenaan -->
  <polygon points="256,34 269,62 300,66 277,87 283,117 256,102 229,117 235,87 212,66 243,62" fill="#FDE047" stroke="#F59E0B" stroke-width="4" stroke-linejoin="round"/>
</svg>
